# vars file
---
influxdb_keyring_src: https://repos.influxdata.com/influxdata-archive.key
influxdb_keyring_dst: /usr/share/keyrings/influxdb.gpg
influxdb_repositories:
  - type: 'deb [signed-by={{ influxdb_keyring_dst }} arch=amd64]'
    url: 'https://repos.influxdata.com/debian stable'
    component: main
  - type: deb
    url: 'https://repos.influxdata.com/debian stable'
    component: main
    state: absent

influxdb_dependencies_pre:
  - software-properties-common
  - dirmngr
  - apt-transport-https
  - wget

influxdb_dependencies:
  - influxdb
  - curl

influxdb_collectd_auth_file: /etc/influxdb/collectd_auth_file
